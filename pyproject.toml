[project]
name = "sol-grid-lab"
version = "0.1.0"
description = "Laboratoire de trading grid SHORT : thèse de risque falsifiable, reproductible, sur données réelles (Binance SOLUSDT perp)."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["src", "data"]
